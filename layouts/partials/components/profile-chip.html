{{/* External profile link. Context: dict "p" <profile entry> */}}
{{- $p := .p -}}
<a class="profile-chip" href="{{ $p.url }}" target="_blank" rel="noopener me"{{ with $p.note }} title="{{ . }}"{{ end }}>
  {{- with $p.icon }}<img src="{{ . | relURL }}" alt="" width="17" height="17" loading="lazy">{{ end -}}
  {{ $p.label }}
</a>

{{ define "main" }}
<article class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    <div class="lede">{{ .Content }}</div>
  </div>
</article>
{{- with .Pages }}
<div class="wrap">
  <ul class="post-list">
    {{- range . }}
      <li class="post-item"><div class="post-item__date"></div>
        <div><h3 class="post-item__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p class="post-item__excerpt">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}</p></div>
      </li>
    {{- end }}
  </ul>
</div>
{{- end }}
{{ end }}

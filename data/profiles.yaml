# External profiles — one definition, reused by the header, the footer and the
# "Elsewhere on the internet" section. `tier` controls prominence:
#   scholarly : shown beside the name and in the footer (Scholar, ORCID, GitHub, LinkedIn)
#   creative  : Compute Stories, Shutterstock, writing
#   playful   : the rest of the digital universe, shown only in the Easter-egg section
profiles:
  - id: scholar
    label: "Google Scholar"
    url: "https://scholar.google.co.uk/citations?user=9yc3jiIAAAAJ&hl=en"
    icon: "images/googlescholar.png"
    tier: scholarly

  - id: orcid
    label: "ORCID"
    url: "https://orcid.org/0000-0002-0071-5167"
    icon: "images/orcid.png"
    tier: scholarly

  - id: github
    label: "GitHub"
    url: "https://github.com/sraocodes"
    icon: "images/github.png"
    tier: scholarly

  - id: linkedin

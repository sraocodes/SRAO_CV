# The research trajectory shown on the homepage. The point of this section is
# continuity: one method — modelling difficult or partly observable systems,
# understanding how their signals arise, and inferring the process underneath —
# applied to progressively larger systems.
trajectory:
  thread: "Physics-based modelling of partly observable systems, and inference from what they emit"
  # Shown beneath the timeline, so the present does not read as a destination.
  now_note: "The last two are happening at once. Watershed hydrology at IISc and frontier-AI evaluation are both current work — not consecutive chapters."
  stages:
    - years: "2010–2013"
      field: "Plasma physics"
      where: "UA Huntsville"
      note: "Particle-in-cell simulation extended from 2D electrostatic to 3D electromagnetic, parallelised with MPI/OpenMP."
      image: "images/waves.png"
      image_alt: "Simulated Ex field showing wave structure in a helicon plasma plume"
    - years: "2013–2016"
      field: "Optoelectronics"
      where: "Alabama A&M · Paderborn"
      note: "Laser–matter interaction experiments, then Fortran Maxwell–Bloch solvers for light propagation in excitonic systems."
      image: "images/bloch2level.jpg"
      image_alt: "Maxwell-Bloch equations for a two-level excitonic system"
    - years: "2016–2020"
      field: "Geoelectrical root sensing"
      where: "UCLouvain"
      note: "Coupled hydro-geophysical models linking root architecture, water uptake and electrical signature — field and laboratory ERT."
      image: "images/eroot1.png"
      image_alt: "Field electrical resistivity survey over a grass root zone"
    - years: "2023–2025"
      field: "Agricultural digital twins"
      where: "Forschungszentrum Jülich"
      note: "Coupling process-based crop models with functional–structural root models across C/C++, Fortran and Python."
      image: "images/DAA.png"
      image_alt: "Digital Agricultural Avatar: a plant and its coupled model representation"
    # The present is not a single strand. These two run at the same time, and
    # `concurrent` marks them so the timeline does not imply one replaced the
    # other. Rendered as a joined "now" band rather than sequential steps.
    - years: "2025–"
      field: "Earth observation & hydrology"
      where: "IISc Bengaluru"
      concurrent: true
      note: "Sentinel-1 soil moisture retrieval, active–passive fusion with SMAP, and decade-scale watershed evaluation across semi-arid Karnataka."
      image: "images/satellite.png"
      image_alt: "Satellite Earth observation feeding computational analysis"
    - years: "2026–"
      field: "Scientific AI"
      where: "Independent · Mercor"
      concurrent: true
      note: "Benchmarks and test environments that measure where frontier models reason soundly about physical systems — running alongside the hydrology, not after it."

